<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ramo de Rosas 3D · Amor Siempre</title>
<style>
  :root{ --bg:#0a0206; }
  html,body{ margin:0; padding:0; width:100%; height:100%; background:var(--bg); overflow:hidden; font-family: Georgia, 'Times New Roman', serif; }
  #scene-canvas{ position:fixed; inset:0; display:block; }
  #ui{
    position:fixed; left:0; right:0; bottom:0; z-index:10;
    display:flex; flex-direction:column; align-items:center; gap:10px;

  }
  #caption{
    color:#ffd7dd; letter-spacing:.12em; font-size:13px; text-transform:uppercase;

  }
  #controls{ display:flex; gap:10px; pointer-events:auto; }
  button{
    background:rgba(20,4,8,.55); color:#ffdfe4; border:1px solid rgba(255,90,110,.55);
    padding:8px 14px; border-radius:999px; font-size:12px; letter-spacing:.06em;
    cursor:pointer; backdrop-filter: blur(6px); transition:all .2s ease;
  }
  button:hover{ background:rgba(255,40,70,.25); box-shadow:0 0 16px rgba(255,40,70,.5); }

    <button id="btnMusic">🎵 Reproducir música</button>

  </div>
</div>

<!-- Coloca tu archivo de música junto a index.html y nómbralo song.mp3 (o cambia el src de abajo) -->

  <source src="song.mp3" type="audio/mpeg">
</audio>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

/* ---------------------------------------------------------
   RAMO DE ROSAS 3D — cámara orbital + fondo con parallax
--------------------------------------------------------- */

const canvas = document.getElementById('scene-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x24101a, 0.017);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth/window.innerHeight, 0.1, 200);
camera.position.set(0, 3.6, 9.5);

/* ============ CONTROLS (auto-orbit + user drag) ============ */
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.6, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 5;
controls.maxDistance = 16;
controls.maxPolarAngle = Math.PI * 0.62;
controls.minPolarAngle = Math.PI * 0.18;
controls.enablePan = false;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.1;

/* ============ FLOOR (reflective marble, lighter tone) ============ */
const floorGeo = new THREE.CircleGeometry(30, 96);
const floorMat = new THREE.MeshStandardMaterial({
  color: 0x241016, metalness: 0.55, roughness: 0.22,
  envMapIntensity: 1.4
});
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI/2;
floor.receiveShadow = true;
scene.add(floor);

// subtle floor grid streaks for marble veining
const veinCanvas = document.createElement('canvas');
veinCanvas.width = veinCanvas.height = 512;
const vctx = veinCanvas.getContext('2d');
vctx.fillStyle = '#241016'; vctx.fillRect(0,0,512,512);
vctx.strokeStyle = 'rgba(200,60,80,0.28)'; vctx.lineWidth = 1.4;
for(let i=0;i<40;i++){
  vctx.beginPath();
  let x = Math.random()*512, y=0;
  vctx.moveTo(x,y);
  for(let j=0;j<8;j++){ x += (Math.random()-0.5)*90; y += 64; vctx.lineTo(x,y); }
  vctx.stroke();
}
const veinTex = new THREE.CanvasTexture(veinCanvas);
veinTex.wrapS = veinTex.wrapT = THREE.RepeatWrapping;
veinTex.repeat.set(4,4);
floorMat.roughnessMap = veinTex;
floorMat.bumpMap = veinTex;
floorMat.bumpScale = 0.02;

/* ============ LIGHTING ============ */
scene.add(new THREE.AmbientLight(0x3d1826, 0.85));
scene.add(new THREE.HemisphereLight(0x4a2030, 0x150508, 0.6));

const keyLight = new THREE.SpotLight(0xfff0e8, 55, 30, Math.PI/5, 0.4, 1.4);
keyLight.position.set(4, 9, 5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024,1024);
keyLight.shadow.bias = -0.001;
scene.add(keyLight);
scene.add(keyLight.target);
keyLight.target.position.set(0,2.5,0);

const pinkRim = new THREE.PointLight(0xff1744, 18, 20, 2);
pinkRim.position.set(-5, 3, -4);
scene.add(pinkRim);

const magentaRim = new THREE.PointLight(0xff2d7a, 14, 18, 2);
magentaRim.position.set(5, 2, -5);
scene.add(magentaRim);

const goldFill = new THREE.PointLight(0xffb37a, 8, 12, 2);
goldFill.position.set(0, 1.5, 4);
scene.add(goldFill);

const heartLight = new THREE.PointLight(0xff3366, 10, 25, 2);
heartLight.position.set(0, 6, -8);
scene.add(heartLight);

/* ============ MATERIALS ============ */
const petalMat = new THREE.MeshPhysicalMaterial({
  color: 0xb3081f, roughness: 0.35, clearcoat: 0.6, clearcoatRoughness:0.3,
  sheen: 1.0, sheenColor: 0xff4060, side: THREE.DoubleSide
});
const petalMatDark = new THREE.MeshPhysicalMaterial({
  color: 0x7a0414, roughness: 0.4, clearcoat: 0.5, clearcoatRoughness:0.35,
  sheen: 0.8, sheenColor: 0xcc1030, side: THREE.DoubleSide
});
const leafMat = new THREE.MeshStandardMaterial({ color: 0x0f3d1c, roughness: 0.55, metalness: 0.05, side: THREE.DoubleSide });
const stemMat = new THREE.MeshStandardMaterial({ color: 0x1c4a24, roughness: 0.6 });
const wrapMat = new THREE.MeshPhysicalMaterial({
  color: 0x060606, roughness: 0.25, metalness: 0.1, clearcoat: 0.9, clearcoatRoughness: 0.15,
  side: THREE.DoubleSide
});
const wrapEdgeMat = new THREE.MeshStandardMaterial({ color: 0xc9962f, metalness: 0.85, roughness: 0.28 });
const ribbonMat = new THREE.MeshPhysicalMaterial({
  color: 0xb30f22, roughness: 0.22, clearcoat: 0.85, clearcoatRoughness: 0.2, side: THREE.DoubleSide
});
const babyBreathMat = new THREE.MeshStandardMaterial({ color: 0xfff6ee, roughness: 0.6, emissive: 0x221111, emissiveIntensity: 0.15 });
const tagMat = new THREE.MeshStandardMaterial({ color: 0x0c0c0c, roughness: 0.4, metalness: 0.3 });
const tagGoldMat = new THREE.MeshStandardMaterial({ color: 0xd4a544, metalness: 0.9, roughness: 0.25 });

/* ============ PROCEDURAL ROSE (high-detail) ============ */
function makePetal(scale=1, jitter=0.05){
  const shape = new THREE.Shape();
  shape.moveTo(0,0);
  shape.bezierCurveTo(0.5,0.15, 0.55,0.85, 0,1.15);
  shape.bezierCurveTo(-0.55,0.85, -0.5,0.15, 0,0);
  // higher curve subdivision for a smoother, more realistic petal edge
  const geo = new THREE.ShapeGeometry(shape, 24);
  geo.scale(0.5*scale,0.5*scale,0.5*scale);
  // curl + ripple the petal via vertex displacement for a natural, non-flat surface
  const pos = geo.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x = pos.getX(i), y = pos.getY(i);
    const curl = Math.sin((y/ (0.6*scale)) * Math.PI*0.5) * 0.22 * scale;
    const ripple = Math.sin(x*14) * 0.012 * scale + Math.sin(y*9 + x*5) * 0.01 * scale;
    pos.setZ(i, pos.getZ(i) + curl - Math.abs(x)*0.15*scale + ripple);
    // slight per-vertex jitter so petals aren't perfectly smooth/identical
    pos.setX(i, x + (Math.random()-0.5)*jitter*scale*0.04);
  }
  geo.computeVertexNormals();
  return geo;
}

function makeRose(size=1){
  const group = new THREE.Group();
  // more layers + more petals per layer = denser, more lifelike bloom
  const layers = [
    { count:4,  radius:0.015, scale:0.26, tilt:0.05, mat: petalMatDark },
    { count:5,  radius:0.03,  scale:0.34, tilt:0.18, mat: petalMatDark },
    { count:6,  radius:0.055, scale:0.44, tilt:0.32, mat: petalMat },
    { count:7,  radius:0.08,  scale:0.54, tilt:0.48, mat: petalMat },
    { count:7,  radius:0.115, scale:0.64, tilt:0.62, mat: petalMat },
    { count:8,  radius:0.15,  scale:0.74, tilt:0.80, mat: petalMatDark },
    { count:8,  radius:0.185, scale:0.85, tilt:0.98, mat: petalMat },
    { count:7,  radius:0.22,  scale:0.96, tilt:1.18, mat: petalMatDark },
    { count:6,  radius:0.25,  scale:1.05, tilt:1.35, mat: petalMat },
  ];
  layers.forEach((layer, li) => {
    const geo = makePetal(layer.scale * size);
    for(let i=0;i<layer.count;i++){
      const petal = new THREE.Mesh(geo, layer.mat);
      const angle = (i/layer.count)*Math.PI*2 + li*0.5;
      petal.position.set(Math.cos(angle)*layer.radius*size, layer.radius*0.5*size, Math.sin(angle)*layer.radius*size);
      petal.rotation.y = -angle + Math.PI/2;
      petal.rotation.x = layer.tilt;
      petal.rotation.z = (Math.random()-0.5)*0.22;
      petal.castShadow = true;
      petal.receiveShadow = true;
      group.add(petal);
    }
  });
  // small bud core, rounder for a smoother tip
  const core = new THREE.Mesh(new THREE.SphereGeometry(0.07*size,14,12), petalMatDark);
  core.position.y = 0.04*size;
  group.add(core);
  return group;
}

function makeLeafShape(){
  const leafShape = new THREE.Shape();
  leafShape.moveTo(0,0);
  leafShape.bezierCurveTo(0.1,0.1, 0.38,0.3, 0.32,0.55);
  leafShape.bezierCurveTo(0.28,0.75, 0.12,0.92, 0,1.08);
  leafShape.bezierCurveTo(-0.12,0.92, -0.28,0.75, -0.32,0.55);
  leafShape.bezierCurveTo(-0.38,0.3, -0.1,0.1, 0,0);
  return leafShape;
}
function makeLeafCluster(size=1){
  const group = new THREE.Group();
  const geo = new THREE.ShapeGeometry(makeLeafShape(), 16);
  geo.scale(0.45*size,0.45*size,0.45*size);
  // give each leaf a gentle mid-vein fold instead of a flat plane
  const pos = geo.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x = pos.getX(i);
    pos.setZ(i, pos.getZ(i) - Math.abs(x)*0.18*size + Math.sin(pos.getY(i)*6)*0.006*size);
  }
  geo.computeVertexNormals();
  const n = 4 + Math.floor(Math.random()*2);
  for(let i=0;i<n;i++){
    const leaf = new THREE.Mesh(geo, leafMat);
    const a = (i/n)*Math.PI*2 + Math.random();
    leaf.rotation.y = a;
    leaf.rotation.x = 0.85 + Math.random()*0.35;
    leaf.scale.setScalar(0.75 + Math.random()*0.4);
    leaf.castShadow = true;
    leaf.receiveShadow = true;
    group.add(leaf);
  }
  return group;
}

function makeBabyBreath(){
  const group = new THREE.Group();
  const sphGeo = new THREE.SphereGeometry(0.045,10,8);
  const n = 6 + Math.floor(Math.random()*5);
  for(let i=0;i<n;i++){
    const s = new THREE.Mesh(sphGeo, babyBreathMat);
    s.position.set((Math.random()-0.5)*0.28,(Math.random())*0.32,(Math.random()-0.5)*0.28);
    s.scale.setScalar(0.55+Math.random()*0.75);
    s.castShadow = true;
    group.add(s);
  }
  return group;
}

/* ============ BOUQUET ASSEMBLY ============ */
const bouquet = new THREE.Group();
scene.add(bouquet);

const roseHeadPositions = [
  [0,2.55,0, 1.0],
  [-0.45,2.35,0.35, 0.85], [0.45,2.35,-0.35, 0.85], [-0.4,2.4,-0.4,0.82], [0.42,2.32,0.4,0.88],
  [-0.85,2.05,0.15,0.78], [0.85,2.05,-0.15,0.8], [0,2.1,0.85,0.82], [0,2.15,-0.82,0.76],
  [-0.7,1.95,-0.6,0.75], [0.72,1.9,0.6,0.78], [-0.55,1.85,0.75,0.7], [0.5,1.8,-0.78,0.72],
  [-1.05,1.75,-0.15,0.68], [1.05,1.7,0.2,0.7], [0.15,1.65,1.05,0.66], [-0.15,1.6,-1.05,0.68],
  [-0.22,2.5,0.62,0.72], [0.25,2.48,-0.6,0.7], [-1.15,2.05,0.55,0.62], [1.1,2.0,-0.5,0.64],
  [0.65,1.55,1.0,0.6], [-0.68,1.5,-0.95,0.6], [1.25,1.45,0.55,0.56], [-1.25,1.4,-0.4,0.58],
  [0.08,1.35,-1.25,0.55], [-0.05,1.3,1.25,0.55],
];

const stemBaseY = 0.15;
roseHeadPositions.forEach(([x,y,z,scale], idx) => {
  const rose = makeRose(scale);
  rose.position.set(x,y,z);
  rose.rotation.y = Math.random()*Math.PI*2;
  rose.rotation.x = (Math.random()-0.5)*0.25;
  rose.rotation.z = (Math.random()-0.5)*0.25;
  bouquet.add(rose);

  // stem from base to rose
  const stemCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(x*0.08, stemBaseY, z*0.08),
    new THREE.Vector3(x*0.5, y*0.55, z*0.5),
    new THREE.Vector3(x, y-0.15, z),
  ]);
  const stemGeo = new THREE.TubeGeometry(stemCurve, 24, 0.028, 10, false);
  const stem = new THREE.Mesh(stemGeo, stemMat);
  stem.castShadow = true;
  bouquet.add(stem);

  if(idx % 2 === 0){
    const leaves = makeLeafCluster(0.9);
    leaves.position.set(x*0.6, y*0.5, z*0.6);
    leaves.rotation.y = Math.random()*Math.PI*2;
    bouquet.add(leaves);
  }
  if(idx % 2 === 0){
    const bb = makeBabyBreath();
    bb.position.set(x + (Math.random()-0.5)*0.3, y+0.2, z + (Math.random()-0.5)*0.3);
    bouquet.add(bb);
  }
});

/* ============ WRAPPING PAPER (cone, black + gold edge) ============ */
const wrapGeo = new THREE.ConeGeometry(1.35, 2.6, 48, 1, true);
const wrap = new THREE.Mesh(wrapGeo, wrapMat);
wrap.position.y = 0.9;
wrap.castShadow = true;
wrap.receiveShadow = true;
bouquet.add(wrap);

// fold flaps (a few angled planes around the top for the "petal wrap" look)
const flapShape = new THREE.Shape();
flapShape.moveTo(-0.55,0);
flapShape.lineTo(0.55,0);
flapShape.lineTo(0.15,1.6);
flapShape.lineTo(-0.1,1.9);
flapShape.lineTo(-0.55,1.4);
flapShape.closePath();
const flapGeo = new THREE.ShapeGeometry(flapShape, 12);
const flapCount = 8;
for(let i=0;i<flapCount;i++){
  const flap = new THREE.Mesh(flapGeo, i%2===0 ? wrapMat : wrapMat.clone());
  const a = (i/flapCount)*Math.PI*2;
  const radius = 1.05;
  flap.position.set(Math.cos(a)*radius, 1.55, Math.sin(a)*radius);
  flap.lookAt(new THREE.Vector3(Math.cos(a)*radius*2, 2.5, Math.sin(a)*radius*2));
  flap.rotateY(Math.PI);
  flap.scale.setScalar(0.85 + Math.random()*0.3);
  flap.castShadow = true;
  bouquet.add(flap);

  // gold edge trim as a thin torus-ish line along flap edge (simple approach: scaled outline)
  const edge = new THREE.Mesh(flapGeo, wrapEdgeMat);
  edge.scale.set(1.03,1.03,1.03);
  edge.position.copy(flap.position);
  edge.rotation.copy(flap.rotation);
  edge.position.y -= 0.005;
  edge.renderOrder = -1;
  bouquet.add(edge);
}

/* ============ RIBBON BOW ============ */
function makeRibbonLoop(width=0.35, length=0.9, twist=0.5){
  const shape = new THREE.Shape();
  shape.moveTo(-width/2,0);
  shape.lineTo(width/2,0);
  shape.lineTo(width/2,length);
  shape.lineTo(-width/2,length);
  shape.closePath();
  const geo = new THREE.ExtrudeGeometry(shape, { depth:0.02, bevelEnabled:false });
  geo.translate(0,0,-0.01);
  return geo;
}
const bow = new THREE.Group();
bow.position.set(0,1.05,1.05);

const loopGeo = makeRibbonLoop(0.32,0.85);
[[-1,0.55],[1,0.55]].forEach(([dir,rot])=>{
  const loop = new THREE.Mesh(loopGeo, ribbonMat);
  loop.position.set(dir*0.28,0.15,0);
  loop.rotation.z = dir*1.05;
  loop.rotation.y = dir*0.3;
  loop.castShadow = true;
  bow.add(loop);
});
// bow knot center
const knot = new THREE.Mesh(new THREE.SphereGeometry(0.16,12,10), ribbonMat);
knot.scale.set(1,0.8,0.8);
knot.castShadow = true;
bow.add(knot);
// tails hanging down
[[-0.14,-0.05],[0.14,0.08]].forEach(([xOff,zOff])=>{
  const tailShape = new THREE.Shape();
  tailShape.moveTo(-0.09,0);
  tailShape.lineTo(0.09,0);
  tailShape.lineTo(0.05,-1.3);
  tailShape.lineTo(0,-1.5);
  tailShape.lineTo(-0.05,-1.3);
  tailShape.closePath();
  const tailGeo = new THREE.ExtrudeGeometry(tailShape, { depth:0.015, bevelEnabled:false });
  const tail = new THREE.Mesh(tailGeo, ribbonMat);
  tail.position.set(xOff,0,zOff);
  tail.rotation.x = -0.1;
  tail.castShadow = true;
  bow.add(tail);
});
bouquet.add(bow);

/* ============ TAGS (paper cards, text via canvas textures) ============ */
function makeTagTexture(lines, w=256,h=256){
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#0c0c0c'; ctx.fillRect(0,0,w,h);
  ctx.strokeStyle = '#d4a544'; ctx.lineWidth = 6;
  ctx.strokeRect(10,10,w-20,h-20);
  ctx.fillStyle = '#d4a544';
  ctx.textAlign = 'center';
  ctx.font = '600 28px Georgia';
  lines.forEach((line,i)=> ctx.fillText(line, w/2, h/2 - (lines.length-1)*18 + i*38));
  ctx.font = '40px Georgia';
  ctx.fillText('♡', w/2, h/2 + (lines.length)*30 + 10);
  return new THREE.CanvasTexture(c);
}
const tagGeo = new THREE.PlaneGeometry(0.5,0.5);
const tag1Mat = new THREE.MeshStandardMaterial({ map: makeTagTexture(['Para alguien','especial']), side: THREE.DoubleSide, roughness:0.5 });
const tag1 = new THREE.Mesh(tagGeo, tag1Mat);
tag1.position.set(0.75,3.1,-0.2);
tag1.rotation.y = -0.5;
bouquet.add(tag1);

const tag2Mat = new THREE.MeshStandardMaterial({ map: makeTagTexture(['Con todo','mi corazón']), side: THREE.DoubleSide, roughness:0.5 });
const tag2 = new THREE.Mesh(new THREE.PlaneGeometry(0.42,0.42), tag2Mat);
tag2.position.set(0.05,0.35,1.15);
tag2.rotation.x = -0.3;
bouquet.add(tag2);

/* ============ PARALLAX NEON BACKGROUND ============ */
/* Layers at different depths react to camera movement for a parallax feel. */
const bgGroup = new THREE.Group();
scene.add(bgGroup);

function makeNeonTextTexture(text, color='#ff3366', w=512,h=256){
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  const ctx = c.getContext('2d');
  ctx.clearRect(0,0,w,h);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font = '700 46px Georgia';
  ctx.shadowColor = color; ctx.shadowBlur = 30;
  ctx.fillStyle = color;
  const lines = text.split('\n');
  lines.forEach((line,i)=> ctx.fillText(line, w/2, h/2 + (i-(lines.length-1)/2)*54));
  ctx.shadowBlur = 12;
  ctx.fillStyle = '#fff';
  lines.forEach((line,i)=> ctx.fillText(line, w/2, h/2 + (i-(lines.length-1)/2)*54));
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
function makeNeonHeartTexture(color='#ff1744', w=256,h=256){
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  const ctx = c.getContext('2d');
  ctx.clearRect(0,0,w,h);
  ctx.translate(w/2,h/2*0.85);
  ctx.beginPath();
  const s = 70;
  ctx.moveTo(0, s*0.3);
  ctx.bezierCurveTo(0,-s*0.3, -s,-s*0.5, -s, s*0.05);
  ctx.bezierCurveTo(-s, s*0.55, -s*0.3, s*0.8, 0, s*1.15);
  ctx.bezierCurveTo(s*0.3, s*0.8, s, s*0.55, s, s*0.05);
  ctx.bezierCurveTo(s, -s*0.5, 0, -s*0.3, 0, s*0.3);
  ctx.closePath();
  ctx.shadowColor = color; ctx.shadowBlur = 35;
  ctx.strokeStyle = color; ctx.lineWidth = 6; ctx.stroke();
  ctx.shadowBlur = 15;
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  return new THREE.CanvasTexture(c);
}

const spriteMat = (tex) => new THREE.SpriteMaterial({ map: tex, transparent:true, depthWrite:false });

const neonLayers = [
  // far layer
  { depth:-22, items:[
      { tex: makeNeonTextTexture('Las mejores\ncosas florécen','#ff2d7a'), pos:[-8,4.2,0], scale:[6,3] },
      { tex: makeNeonHeartTexture('#ff1744'), pos:[8.5,5.5,0], scale:[4,4] },
    ]},
  // mid layer
  { depth:-14, items:[
      { tex: makeNeonTextTexture('Amor\nSiempre','#ff3366'), pos:[9,2.2,0], scale:[4.5,2.5] },
      { tex: makeNeonHeartTexture('#ff2d7a'), pos:[-9.5,0.8,0], scale:[3,3] },
    ]},
  // near-ish accent layer
  { depth:-9, items:[
      { tex: makeNeonHeartTexture('#ff0033'), pos:[6.5,-0.5,0], scale:[1.8,1.8] },
      { tex: makeNeonHeartTexture('#ff0033'), pos:[-6,4.6,0], scale:[1.3,1.3] },
    ]},
];

const parallaxLayers = [];
neonLayers.forEach(layer => {
  const holder = new THREE.Group();
  holder.position.z = layer.depth;
  layer.items.forEach(it => {
    const sprite = new THREE.Sprite(spriteMat(it.tex));
    sprite.position.set(it.pos[0], it.pos[1], it.pos[2]);
    sprite.scale.set(it.scale[0], it.scale[1], 1);
    sprite.userData.baseScale = { x: it.scale[0], y: it.scale[1] };
    holder.add(sprite);
  });
  bgGroup.add(holder);
  parallaxLayers.push({ group: holder, depth: layer.depth, factor: THREE.MathUtils.clamp(1 - Math.abs(layer.depth)/24, 0.15, 0.9) });
});

// backdrop panel (subtle vertical gradient wall) behind everything, also parallaxes a little
const backWallGeo = new THREE.PlaneGeometry(60,30);
const backWallCanvas = document.createElement('canvas');
backWallCanvas.width=64; backWallCanvas.height=64;
const bwctx = backWallCanvas.getContext('2d');
const grad = bwctx.createLinearGradient(0,0,0,64);
grad.addColorStop(0,'#3d1220');
grad.addColorStop(0.5,'#2a0d16');
grad.addColorStop(1,'#1c0810');
bwctx.fillStyle = grad; bwctx.fillRect(0,0,64,64);
const backWallTex = new THREE.CanvasTexture(backWallCanvas);
const backWall = new THREE.Mesh(backWallGeo, new THREE.MeshBasicMaterial({ map: backWallTex }));
backWall.position.set(0,5,-26);
bgGroup.add(backWall);
parallaxLayers.push({ group: backWall, depth: -26, factor: 0.08 });

// floor reflections of neon (colored point lights already do some of this via pinkRim/magentaRim)

/* mirrored floor text hint using a duplicated, flipped sprite group for "reflection" look */
const reflectGroup = new THREE.Group();
reflectGroup.scale.y = -1;
reflectGroup.position.y = -0.02;
neonLayers.forEach((layer, li) => {
  const holder = parallaxLayers[li].group;
  const mirror = holder.clone();
  mirror.traverse(o => { if(o.material){ o.material = o.material.clone(); o.material.opacity = 0.18; } });
  reflectGroup.add(mirror);
});
scene.add(reflectGroup);

/* ============ ENVIRONMENT MAP (for reflections/clearcoat) ============ */
const pmrem = new THREE.PMREMGenerator(renderer);
const envScene = new THREE.Scene();
envScene.background = new THREE.Color(0x1a0508);
const envLight1 = new THREE.Mesh(new THREE.SphereGeometry(5,16,16), new THREE.MeshBasicMaterial({color:0xff2d5a}));
envLight1.position.set(10,10,-10); envScene.add(envLight1);
const envTex = pmrem.fromScene(envScene, 0.1).texture;
scene.environment = envTex;
envScene.clear && envScene.clear();

/* ============ RESIZE ============ */
function onResize(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', onResize);

/* ============ AUDIO — música en loop + análisis para luces reactivas ============ */
const bgMusic = document.getElementById('bgMusic');
const btnMusic = document.getElementById('btnMusic');
let audioCtx = null, analyser = null, freqData = null, musicPlaying = false;

function initAudioGraph(){
  if(audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const source = audioCtx.createMediaElementSource(bgMusic);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 128;
  analyser.smoothingTimeConstant = 0.82;
  freqData = new Uint8Array(analyser.frequencyBinCount);
  source.connect(analyser);
  analyser.connect(audioCtx.destination);
}

btnMusic.addEventListener('click', async () => {
  try{
    initAudioGraph();
    if(audioCtx.state === 'suspended') await audioCtx.resume();
    if(musicPlaying){
      bgMusic.pause();
      musicPlaying = false;
      btnMusic.textContent = '🎵 Reproducir música';
      btnMusic.classList.remove('active');
    } else {
      await bgMusic.play(); // el atributo loop en <audio> lo repite indefinidamente hasta cerrar la pestaña
      musicPlaying = true;
      btnMusic.textContent = '🔇 Silenciar';
      btnMusic.classList.add('active');
    }
  } catch(err){
    console.warn('No se pudo reproducir el audio:', err);
    btnMusic.textContent = '⚠ Agrega song.mp3';
  }
});

// audio levels read each frame by the render loop (bass/mid/treble, 0..1)
const audioLevel = { bass:0, mid:0, treble:0 };
function updateAudioLevels(){
  if(!analyser || !musicPlaying){ audioLevel.bass=audioLevel.mid=audioLevel.treble=0; return; }
  analyser.getByteFrequencyData(freqData);
  const n = freqData.length;
  const bassEnd = Math.max(1, Math.floor(n*0.18));
  const midEnd = Math.max(bassEnd+1, Math.floor(n*0.55));
  let sum=0; for(let i=0;i<bassEnd;i++) sum += freqData[i];
  audioLevel.bass = sum/bassEnd/255;
  sum=0; for(let i=bassEnd;i<midEnd;i++) sum += freqData[i];
  audioLevel.mid = sum/(midEnd-bassEnd)/255;
  sum=0; for(let i=midEnd;i<n;i++) sum += freqData[i];
  audioLevel.treble = sum/(n-midEnd)/255;
}

/* ============ UI BUTTONS ============ */
const btnSpin = document.getElementById('btnSpin');
btnSpin.addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  btnSpin.textContent = controls.autoRotate ? '⏸ Pausar giro' : '▶ Reanudar giro';
});
document.getElementById('btnReset').addEventListener('click', () => {
  camera.position.set(0,3.6,9.5);
  controls.target.set(0,2.6,0);
  controls.update();
});

/* ============ ANIMATE ============ */
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  const dt = clock.getDelta();

  // gentle bob for the whole bouquet (life-like sway)
  bouquet.position.y = Math.sin(t*0.6)*0.03;
  bouquet.rotation.y += 0.0008;

  controls.update();

  updateAudioLevels();
  const { bass, mid, treble } = audioLevel;

  // PARALLAX: shift each background layer opposite-ish to camera azimuth, scaled by depth factor
  const camAngle = Math.atan2(camera.position.x, camera.position.z);
  parallaxLayers.forEach(pl => {
    pl.group.position.x = -Math.sin(camAngle) * 6 * pl.factor;
    pl.group.position.y = 5 + Math.cos(t*0.15 + pl.depth) * 0.15 * pl.factor + (camera.position.y-3.6)*0.15*pl.factor;
  });

  // flicker + audio-reactive pulse on neon sprites
  bgGroup.traverse(o => {
    if(o.isSprite){
      o.material.opacity = 0.85 + Math.sin(t*6 + o.position.x)*0.08 + (Math.random()<0.003 ? -0.3:0) + treble*0.15;
      const base = o.userData.baseScale;
      if(base){
        const pulse = 1 + bass*0.22 + mid*0.08;
        o.scale.set(base.x*pulse, base.y*pulse, 1);
      }
    }
  });

  // light shimmer, boosted by the music's bass/mid/treble bands when playing (idle = just the sine shimmer)
  pinkRim.intensity = (16 + Math.sin(t*1.3)*3) * (1 + bass*1.8);
  magentaRim.intensity = (12 + Math.cos(t*1.7)*3) * (1 + mid*1.6);
  heartLight.intensity = (9 + Math.sin(t*2.1)*2) * (1 + treble*1.5);
  renderer.toneMappingExposure = 1.15 + treble*0.12 + bass*0.08;

  renderer.render(scene, camera);
}

const loading = document.getElementById('loading');
setTimeout(() => {
  loading.style.opacity = '0';
  setTimeout(()=> loading.style.display='none', 650);
}, 400);

animate();
</script>
