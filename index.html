<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { Water } from "three/addons/objects/Water.js";

/* ---------------------------------------------------------
   RAMO DE ROSAS 3D — cámara orbital + fondo con parallax
--------------------------------------------------------- */

const canvas = document.getElementById('scene-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x24101a, 0.017);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth/window.innerHeight, 0.1, 200);
camera.position.set(0, 3.6, 9.5);

/* ============ CONTROLS (auto-orbit + user drag) ============ */
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.6, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 5;
controls.maxDistance = 16;
controls.maxPolarAngle = Math.PI * 0.62;
controls.minPolarAngle = Math.PI * 0.18;
controls.enablePan = false;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.1;

/* ============ FLOOR — real reflective water (Three.js Water) + rain ============ */
/* The earlier version faked reflections with a mirrored, flipped copy of the neon
   sprites sitting *under* an opaque floor — which hid them completely (the floor,
   being solid, blocked the very thing it was supposed to show). Three.js's own
   Water object does this properly: it renders a live mirror texture of the scene
   plus an animated, sunlit ripple normal-map, so it actually reads as water. */
const WATER_RADIUS = 22; // world units the rain/splashes are allowed to land within
const waterGeo = new THREE.PlaneGeometry(70, 70);
const waterNormals = new THREE.TextureLoader().load(
  'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/textures/waternormals.jpg',
  tex => { tex.wrapS = tex.wrapT = THREE.RepeatWrapping; }
);
const water = new Water(waterGeo, {
  textureWidth: 512,
  textureHeight: 512,
  waterNormals,
  sunDirection: new THREE.Vector3(0.25, 0.6, 0.35),
  sunColor: 0xffe6d5,
  waterColor: 0x220a12,
  distortionScale: 2.0,
  fog: scene.fog !== undefined,
});
water.material.uniforms['alpha'].value = 0.97;
water.rotation.x = -Math.PI/2;
scene.add(water);

/* Falling rain drops that spawn a real expanding ring "splash" mesh on impact
   (a pooled set of rings, additive-blended, growing + fading — recycled rather
   than recreated so this stays cheap at 60fps). */
const rainGroup = new THREE.Group();
scene.add(rainGroup);
const rainMat = new THREE.MeshBasicMaterial({ color: 0xdfeaff, transparent:true, opacity:0.7 });
const rainGeo = new THREE.CylinderGeometry(0.006, 0.006, 0.32, 4, 1);
const RAIN_COUNT = 90;
const rainDrops = [];
for(let i=0;i<RAIN_COUNT;i++){
  const drop = new THREE.Mesh(rainGeo, rainMat);
  const radius = Math.random()*WATER_RADIUS*0.85;
  const angle = Math.random()*Math.PI*2;
  const speed = 10 + Math.random()*6;
  drop.position.set(Math.cos(angle)*radius, Math.random()*14, Math.sin(angle)*radius);
  rainGroup.add(drop);
  rainDrops.push({ mesh: drop, speed, radius, angle });
}

const SPLASH_POOL_SIZE = 30;
const splashGeo = new THREE.RingGeometry(0.05, 0.085, 24);
const splashPool = [];
for(let i=0;i<SPLASH_POOL_SIZE;i++){
  const mat = new THREE.MeshBasicMaterial({
    color: 0xcfe4ff, transparent:true, opacity:0, side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending, depthWrite:false
  });
  const mesh = new THREE.Mesh(splashGeo, mat);
  mesh.rotation.x = -Math.PI/2;
  mesh.visible = false;
  scene.add(mesh);
  splashPool.push({ mesh, life:0, active:false });
}
function spawnSplash(x, z){
  const s = splashPool.find(s => !s.active) || splashPool[0];
  s.active = true; s.life = 0;
  s.mesh.position.set(x, 0.02, z);
  s.mesh.scale.setScalar(1);
  s.mesh.material.opacity = 0.55;
  s.mesh.visible = true;
}
function updateSplashes(dt){
  splashPool.forEach(s => {
    if(!s.active) return;
    s.life += dt;
    const k = s.life/0.9;
    if(k >= 1){ s.active=false; s.mesh.visible=false; return; }
    s.mesh.scale.setScalar(1 + k*16);
    s.mesh.material.opacity = 0.55*(1-k);
  });
}
function updateRain(dt){
  rainDrops.forEach(rd => {
    rd.mesh.position.y -= rd.speed * dt;
    if(rd.mesh.position.y <= 0.02){
      spawnSplash(rd.mesh.position.x, rd.mesh.position.z);
      rd.radius = Math.random()*WATER_RADIUS*0.85;
      rd.angle = Math.random()*Math.PI*2;
      rd.mesh.position.set(Math.cos(rd.angle)*rd.radius, 10 + Math.random()*6, Math.sin(rd.angle)*rd.radius);
    }
  });
}

/* ============ LIGHTING ============ */
scene.add(new THREE.AmbientLight(0x3d1826, 0.85));
scene.add(new THREE.HemisphereLight(0x4a2030, 0x150508, 0.6));

/* Two stage "reflectores" crossing onto the bouquet from front-left and front-right,
   each with a faint visible beam cone (additive, gradient-alpha) for a theatrical look. */
function makeSpotBeam(spot, color, length, coneAngle){
  const radius = Math.tan(coneAngle) * length;
  const beamGeo = new THREE.ConeGeometry(radius, length, 24, 1, true);
  // fade the beam from bright at the light to transparent at the far end
  const pos = beamGeo.attributes.position;
  const alphas = new Float32Array(pos.count);
  for(let i=0;i<pos.count;i++){
    const y = pos.getY(i); // local cone: y=-length/2 is the wide base, y=+length/2 is the narrow apex
    alphas[i] = THREE.MathUtils.clamp((y + length/2)/length, 0, 1); // 1 at apex (ends up at the light), 0 at the base (ends up at the target)
  }
  beamGeo.setAttribute('alpha', new THREE.BufferAttribute(alphas,1));
  const beamMat = new THREE.ShaderMaterial({
    uniforms: { uColor: { value: new THREE.Color(color) } },
    vertexShader: `
      attribute float alpha;
      varying float vAlpha;
      void main(){
        vAlpha = alpha;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
      }`,
    fragmentShader: `
      uniform vec3 uColor;
      varying float vAlpha;
      void main(){
        gl_FragColor = vec4(uColor, vAlpha*0.16);
      }`,
    transparent:true, depthWrite:false, side:THREE.DoubleSide, blending: THREE.AdditiveBlending
  });
  const beam = new THREE.Mesh(beamGeo, beamMat);
  return beam;
}

function makeSpotlightRig(color, position, targetPos, intensity, castsShadow){
  const spot = new THREE.SpotLight(color, intensity, 26, Math.PI/7.5, 0.35, 1.6);
  spot.position.copy(position);
  scene.add(spot);
  scene.add(spot.target);
  spot.target.position.copy(targetPos);
  if(castsShadow){
    spot.castShadow = true;
    spot.shadow.mapSize.set(1024,1024);
    spot.shadow.bias = -0.001;
  }
  // visible beam cone, aimed the same way as the spotlight
  const dir = new THREE.Vector3().subVectors(targetPos, position);
  const length = dir.length();
  const dirNorm = dir.clone().normalize();
  const beam = makeSpotBeam(spot, color, length, Math.PI/7.5);
  beam.position.copy(position).addScaledVector(dirNorm, length/2);
  // cone apex (narrow, local +Y) sits at the light; the wide base (local -Y) opens out toward the target
  beam.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dirNorm.clone().negate());
  scene.add(beam);
  return spot;
}

const spotLeft = makeSpotlightRig(0xfff2e0, new THREE.Vector3(-5, 8.5, 4.5), new THREE.Vector3(0,2.3,0), 60, true);
const spotRight = makeSpotlightRig(0xffe6ea, new THREE.Vector3(5, 8, -3.5), new THREE.Vector3(0,2.3,0), 50, false);

const pinkRim = new THREE.PointLight(0xff1744, 18, 20, 2);
pinkRim.position.set(-5, 3, -4);
scene.add(pinkRim);

const magentaRim = new THREE.PointLight(0xff2d7a, 14, 18, 2);
magentaRim.position.set(5, 2, -5);
scene.add(magentaRim);

const goldFill = new THREE.PointLight(0xffb37a, 8, 12, 2);
goldFill.position.set(0, 1.5, 4);
scene.add(goldFill);

const heartLight = new THREE.PointLight(0xff3366, 10, 25, 2);
heartLight.position.set(0, 6, -8);
scene.add(heartLight);

/* ============ MATERIALS ============ */
const petalMat = new THREE.MeshPhysicalMaterial({
  color: 0xb3081f, roughness: 0.35, clearcoat: 0.6, clearcoatRoughness:0.3,
  sheen: 1.0, sheenColor: 0xff4060, side: THREE.DoubleSide
});
const petalMatDark = new THREE.MeshPhysicalMaterial({
  color: 0x7a0414, roughness: 0.4, clearcoat: 0.5, clearcoatRoughness:0.35,
  sheen: 0.8, sheenColor: 0xcc1030, side: THREE.DoubleSide
});
const leafMat = new THREE.MeshStandardMaterial({ color: 0x0f3d1c, roughness: 0.55, metalness: 0.05, side: THREE.DoubleSide });
const stemMat = new THREE.MeshStandardMaterial({ color: 0x1c4a24, roughness: 0.6 });
const wrapMat = new THREE.MeshPhysicalMaterial({
  color: 0x060606, roughness: 0.25, metalness: 0.1, clearcoat: 0.9, clearcoatRoughness: 0.15,
  side: THREE.DoubleSide
});
const wrapEdgeMat = new THREE.MeshStandardMaterial({ color: 0xc9962f, metalness: 0.85, roughness: 0.28 });
const ribbonMat = new THREE.MeshPhysicalMaterial({
  color: 0xb30f22, roughness: 0.22, clearcoat: 0.85, clearcoatRoughness: 0.2, side: THREE.DoubleSide
});
const babyBreathMat = new THREE.MeshStandardMaterial({ color: 0xfff6ee, roughness: 0.6, emissive: 0x221111, emissiveIntensity: 0.15 });
const tagMat = new THREE.MeshStandardMaterial({ color: 0x0c0c0c, roughness: 0.4, metalness: 0.3 });
const tagGoldMat = new THREE.MeshStandardMaterial({ color: 0xd4a544, metalness: 0.9, roughness: 0.25 });

/* ============ PROCEDURAL ROSE (high-detail) ============ */
function makePetal(scale=1, jitter=0.05){
  const shape = new THREE.Shape();
  shape.moveTo(0,0);
  shape.bezierCurveTo(0.5,0.15, 0.55,0.85, 0,1.15);
  shape.bezierCurveTo(-0.55,0.85, -0.5,0.15, 0,0);
  // higher curve subdivision for a smoother, more realistic petal edge
  const geo = new THREE.ShapeGeometry(shape, 24);
  geo.scale(0.5*scale,0.5*scale,0.5*scale);
  // curl + ripple the petal via vertex displacement for a natural, non-flat surface
  const pos = geo.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x = pos.getX(i), y = pos.getY(i);
    const curl = Math.sin((y/ (0.6*scale)) * Math.PI*0.5) * 0.22 * scale;
    const ripple = Math.sin(x*14) * 0.012 * scale + Math.sin(y*9 + x*5) * 0.01 * scale;
    pos.setZ(i, pos.getZ(i) + curl - Math.abs(x)*0.15*scale + ripple);
    // slight per-vertex jitter so petals aren't perfectly smooth/identical
    pos.setX(i, x + (Math.random()-0.5)*jitter*scale*0.04);
  }
  geo.computeVertexNormals();
  return geo;
}

function makeRose(size=1){
  const group = new THREE.Group();
  // more layers + more petals per layer = denser, more lifelike bloom
  const layers = [
    { count:4,  radius:0.015, scale:0.26, tilt:0.05, mat: petalMatDark },
    { count:5,  radius:0.03,  scale:0.34, tilt:0.18, mat: petalMatDark },
    { count:6,  radius:0.055, scale:0.44, tilt:0.32, mat: petalMat },
    { count:7,  radius:0.08,  scale:0.54, tilt:0.48, mat: petalMat },
    { count:7,  radius:0.115, scale:0.64, tilt:0.62, mat: petalMat },
    { count:8,  radius:0.15,  scale:0.74, tilt:0.80, mat: petalMatDark },
    { count:8,  radius:0.185, scale:0.85, tilt:0.98, mat: petalMat },
    { count:7,  radius:0.22,  scale:0.96, tilt:1.18, mat: petalMatDark },
    { count:6,  radius:0.25,  scale:1.05, tilt:1.35, mat: petalMat },
  ];
  layers.forEach((layer, li) => {
    const geo = makePetal(layer.scale * size);
    for(let i=0;i<layer.count;i++){
      const petal = new THREE.Mesh(geo, layer.mat);
      const angle = (i/layer.count)*Math.PI*2 + li*0.5;
      petal.position.set(Math.cos(angle)*layer.radius*size, layer.radius*0.5*size, Math.sin(angle)*layer.radius*size);
      petal.rotation.y = -angle + Math.PI/2;
      petal.rotation.x = layer.tilt;
      petal.rotation.z = (Math.random()-0.5)*0.22;
      petal.castShadow = true;
      petal.receiveShadow = true;
      group.add(petal);
    }
  });
  // small bud core, rounder for a smoother tip
  const core = new THREE.Mesh(new THREE.SphereGeometry(0.07*size,14,12), petalMatDark);
  core.position.y = 0.04*size;
  group.add(core);
  return group;
}

function makeLeafShape(){
  const leafShape = new THREE.Shape();
  leafShape.moveTo(0,0);
  leafShape.bezierCurveTo(0.1,0.1, 0.38,0.3, 0.32,0.55);
  leafShape.bezierCurveTo(0.28,0.75, 0.12,0.92, 0,1.08);
  leafShape.bezierCurveTo(-0.12,0.92, -0.28,0.75, -0.32,0.55);
  leafShape.bezierCurveTo(-0.38,0.3, -0.1,0.1, 0,0);
  return leafShape;
}
function makeLeafCluster(size=1){
  const group = new THREE.Group();
  const geo = new THREE.ShapeGeometry(makeLeafShape(), 16);
  geo.scale(0.45*size,0.45*size,0.45*size);
  // give each leaf a gentle mid-vein fold instead of a flat plane
  const pos = geo.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x = pos.getX(i);
    pos.setZ(i, pos.getZ(i) - Math.abs(x)*0.18*size + Math.sin(pos.getY(i)*6)*0.006*size);
  }
  geo.computeVertexNormals();
  const n = 4 + Math.floor(Math.random()*2);
  for(let i=0;i<n;i++){
    const leaf = new THREE.Mesh(geo, leafMat);
    const a = (i/n)*Math.PI*2 + Math.random();
    leaf.rotation.y = a;
    leaf.rotation.x = 0.85 + Math.random()*0.35;
    leaf.scale.setScalar(0.75 + Math.random()*0.4);
    leaf.castShadow = true;
    leaf.receiveShadow = true;
    group.add(leaf);
  }
  return group;
}

function makeBabyBreath(){
  const group = new THREE.Group();
  const sphGeo = new THREE.SphereGeometry(0.045,10,8);
  const n = 6 + Math.floor(Math.random()*5);
  for(let i=0;i<n;i++){
    const s = new THREE.Mesh(sphGeo, babyBreathMat);
    s.position.set((Math.random()-0.5)*0.28,(Math.random())*0.32,(Math.random()-0.5)*0.28);
    s.scale.setScalar(0.55+Math.random()*0.75);
    s.castShadow = true;
    group.add(s);
  }
  return group;
}

/* ============ BOUQUET ASSEMBLY ============ */
const bouquet = new THREE.Group();
scene.add(bouquet);

const roseHeadPositions = [
  [0,2.55,0, 1.0],
  [-0.45,2.35,0.35, 0.85], [0.45,2.35,-0.35, 0.85], [-0.4,2.4,-0.4,0.82], [0.42,2.32,0.4,0.88],
  [-0.85,2.05,0.15,0.78], [0.85,2.05,-0.15,0.8], [0,2.1,0.85,0.82], [0,2.15,-0.82,0.76],
  [-0.7,1.95,-0.6,0.75], [0.72,1.9,0.6,0.78], [-0.55,1.85,0.75,0.7], [0.5,1.8,-0.78,0.72],
  [-1.05,1.75,-0.15,0.68], [1.05,1.7,0.2,0.7], [0.15,1.65,1.05,0.66], [-0.15,1.6,-1.05,0.68],
  [-0.22,2.5,0.62,0.72], [0.25,2.48,-0.6,0.7], [-1.15,2.05,0.55,0.62], [1.1,2.0,-0.5,0.64],
  [0.65,1.55,1.0,0.6], [-0.68,1.5,-0.95,0.6], [1.25,1.45,0.55,0.56], [-1.25,1.4,-0.4,0.58],
  [0.08,1.35,-1.25,0.55], [-0.05,1.3,1.25,0.55],
];

const stemBaseY = 0.15;
roseHeadPositions.forEach(([x,y,z,scale], idx) => {
  const rose = makeRose(scale);
  rose.position.set(x,y,z);
  rose.rotation.y = Math.random()*Math.PI*2;
  rose.rotation.x = (Math.random()-0.5)*0.25;
  rose.rotation.z = (Math.random()-0.5)*0.25;
  bouquet.add(rose);

  // stem from base to rose
  const stemCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(x*0.08, stemBaseY, z*0.08),
    new THREE.Vector3(x*0.5, y*0.55, z*0.5),
    new THREE.Vector3(x, y-0.15, z),
  ]);
  const stemGeo = new THREE.TubeGeometry(stemCurve, 24, 0.028, 10, false);
  const stem = new THREE.Mesh(stemGeo, stemMat);
  stem.castShadow = true;
  bouquet.add(stem);

  if(idx % 2 === 0){
    const leaves = makeLeafCluster(0.9);
    leaves.position.set(x*0.6, y*0.5, z*0.6);
    leaves.rotation.y = Math.random()*Math.PI*2;
    bouquet.add(leaves);
  }
  if(idx % 2 === 0){
    const bb = makeBabyBreath();
    bb.position.set(x + (Math.random()-0.5)*0.3, y+0.2, z + (Math.random()-0.5)*0.3);
    bouquet.add(bb);
  }
});

/* ============ WRAPPING PAPER (pleated paper cone, high-detail) ============ */
/* A plain ConeGeometry reads as a mathematical shape, not paper — so we take a
   dense cone mesh and fold it: sharp radial pleats (like a gathered paper skirt),
   fine crinkle noise for surface irregularity, and an uneven ruffled hem at the
   wide bottom edge instead of a perfect circle. A gold tube traces that same
   ruffled hem to match the wrap's trim. */
const wrapRadius = 1.35, wrapHeight = 2.6, wrapRadial = 96, wrapHeightSeg = 14, wrapPleats = 18;

function pleatOffset(angle, radiusFrac){
  const fold = Math.sin(angle*wrapPleats);
  const sharp = Math.sign(fold) * Math.pow(Math.abs(fold), 0.55);
  return sharp * 0.065 * wrapRadius * radiusFrac;
}
function hemDroop(angle){
  return Math.sin(angle*9 + 1.3)*0.05 + Math.sin(angle*23)*0.022 + Math.sin(angle*5-0.6)*0.03;
}

const wrapGeo = new THREE.ConeGeometry(wrapRadius, wrapHeight, wrapRadial, wrapHeightSeg, true);
{
  const pos = wrapGeo.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const angle = Math.atan2(z,x);
    const heightFrac = THREE.MathUtils.clamp((y + wrapHeight/2)/wrapHeight, 0, 1); // 0=wide base,1=narrow apex
    const radiusFrac = 1 - heightFrac;
    const currentRadius = Math.sqrt(x*x+z*z);

    const pleat = pleatOffset(angle, radiusFrac);
    const crinkle = (Math.sin(angle*41 + y*6) * 0.009 + Math.sin(angle*17 - y*4) * 0.007) * radiusFrac;
    const targetRadius = Math.max(0, currentRadius + pleat + crinkle);
    const s = currentRadius > 1e-5 ? targetRadius/currentRadius : 1;
    pos.setX(i, x*s);
    pos.setZ(i, z*s);

    // ruffle only the bottom-most ring (the open hem) so it droops unevenly like real paper
    if(heightFrac < 0.02){
      pos.setY(i, y - Math.abs(hemDroop(angle))*wrapRadius*0.55);
    }
  }
  wrapGeo.computeVertexNormals();
}
const wrap = new THREE.Mesh(wrapGeo, wrapMat);
wrap.position.y = 0.9;
wrap.castShadow = true;
wrap.receiveShadow = true;
bouquet.add(wrap);

// gold hem trim following the exact same ruffled/pleated bottom edge
const hemPts = [];
const hemSeg = 160;
for(let i=0;i<=hemSeg;i++){
  const angle = (i/hemSeg)*Math.PI*2;
  const r = wrapRadius + pleatOffset(angle, 1);
  const y = -wrapHeight/2 - Math.abs(hemDroop(angle))*wrapRadius*0.55;
  hemPts.push(new THREE.Vector3(Math.cos(angle)*r, y, Math.sin(angle)*r));
}
const hemCurve = new THREE.CatmullRomCurve3(hemPts, true);
const hemGeo = new THREE.TubeGeometry(hemCurve, 200, 0.013, 8, true);
const hem = new THREE.Mesh(hemGeo, wrapEdgeMat);
hem.position.y = wrap.position.y;
hem.castShadow = true;
bouquet.add(hem);

// a slightly smaller inner liner cone (subtle warm tone) glimpsed through the pleat gaps for depth
const linerGeo = new THREE.ConeGeometry(wrapRadius*0.94, wrapHeight*0.97, 64, 1, true);
const linerMat = new THREE.MeshStandardMaterial({ color: 0x2a0c14, roughness: 0.6, side: THREE.BackSide });
const liner = new THREE.Mesh(linerGeo, linerMat);
liner.position.y = 0.9;
bouquet.add(liner);

// fold flaps (a few angled planes around the top for the "petal wrap" look)
const flapShape = new THREE.Shape();
flapShape.moveTo(-0.55,0);
flapShape.lineTo(0.55,0);
flapShape.lineTo(0.15,1.6);
flapShape.lineTo(-0.1,1.9);
flapShape.lineTo(-0.55,1.4);
flapShape.closePath();
const flapGeo = new THREE.ShapeGeometry(flapShape, 12);
const flapCount = 8;
for(let i=0;i<flapCount;i++){
  const flap = new THREE.Mesh(flapGeo, i%2===0 ? wrapMat : wrapMat.clone());
  const a = (i/flapCount)*Math.PI*2;
  const radius = 1.05;
  flap.position.set(Math.cos(a)*radius, 1.55, Math.sin(a)*radius);
  flap.lookAt(new THREE.Vector3(Math.cos(a)*radius*2, 2.5, Math.sin(a)*radius*2));
  flap.rotateY(Math.PI);
  flap.scale.setScalar(0.85 + Math.random()*0.3);
  flap.castShadow = true;
  bouquet.add(flap);

  // gold edge trim as a thin torus-ish line along flap edge (simple approach: scaled outline)
  const edge = new THREE.Mesh(flapGeo, wrapEdgeMat);
  edge.scale.set(1.03,1.03,1.03);
  edge.position.copy(flap.position);
  edge.rotation.copy(flap.rotation);
  edge.position.y -= 0.005;
  edge.renderOrder = -1;
  bouquet.add(edge);
}

/* ============ RIBBON BOW ============ */
function makeRibbonLoop(width=0.35, length=0.9, twist=0.5){
  const shape = new THREE.Shape();
  shape.moveTo(-width/2,0);
  shape.lineTo(width/2,0);
  shape.lineTo(width/2,length);
  shape.lineTo(-width/2,length);
  shape.closePath();
  const geo = new THREE.ExtrudeGeometry(shape, { depth:0.02, bevelEnabled:false });
  geo.translate(0,0,-0.01);
  return geo;
}
const bow = new THREE.Group();
bow.position.set(0,1.05,1.05);

const loopGeo = makeRibbonLoop(0.32,0.85);
[[-1,0.55],[1,0.55]].forEach(([dir,rot])=>{
  const loop = new THREE.Mesh(loopGeo, ribbonMat);
  loop.position.set(dir*0.28,0.15,0);
  loop.rotation.z = dir*1.05;
  loop.rotation.y = dir*0.3;
  loop.castShadow = true;
  bow.add(loop);
});
// bow knot center
const knot = new THREE.Mesh(new THREE.SphereGeometry(0.16,12,10), ribbonMat);
knot.scale.set(1,0.8,0.8);
knot.castShadow = true;
bow.add(knot);
// tails hanging down
[[-0.14,-0.05],[0.14,0.08]].forEach(([xOff,zOff])=>{
  const tailShape = new THREE.Shape();
  tailShape.moveTo(-0.09,0);
  tailShape.lineTo(0.09,0);
  tailShape.lineTo(0.05,-1.3);
  tailShape.lineTo(0,-1.5);
  tailShape.lineTo(-0.05,-1.3);
  tailShape.closePath();
  const tailGeo = new THREE.ExtrudeGeometry(tailShape, { depth:0.015, bevelEnabled:false });
  const tail = new THREE.Mesh(tailGeo, ribbonMat);
  tail.position.set(xOff,0,zOff);
  tail.rotation.x = -0.1;
  tail.castShadow = true;
  bow.add(tail);
});
bouquet.add(bow);

/* ============ TAGS (paper cards, text via canvas textures) ============ */
function makeTagTexture(lines, w=256,h=256){
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#0c0c0c'; ctx.fillRect(0,0,w,h);
  ctx.strokeStyle = '#d4a544'; ctx.lineWidth = 6;
  ctx.strokeRect(10,10,w-20,h-20);
  ctx.fillStyle = '#d4a544';
  ctx.textAlign = 'center';
  ctx.font = '600 28px Georgia';
  lines.forEach((line,i)=> ctx.fillText(line, w/2, h/2 - (lines.length-1)*18 + i*38));
  ctx.font = '40px Georgia';
  ctx.fillText('♡', w/2, h/2 + (lines.length)*30 + 10);
  return new THREE.CanvasTexture(c);
}
const tagGeo = new THREE.PlaneGeometry(0.5,0.5);
const tag1Mat = new THREE.MeshStandardMaterial({ map: makeTagTexture(['Para alguien','especial']), side: THREE.DoubleSide, roughness:0.5 });
const tag1 = new THREE.Mesh(tagGeo, tag1Mat);
tag1.position.set(0.75,3.1,-0.2);
tag1.rotation.y = -0.5;
bouquet.add(tag1);

const tag2Mat = new THREE.MeshStandardMaterial({ map: makeTagTexture(['Con todo','mi corazón']), side: THREE.DoubleSide, roughness:0.5 });
const tag2 = new THREE.Mesh(new THREE.PlaneGeometry(0.42,0.42), tag2Mat);
tag2.position.set(0.05,0.35,1.15);
tag2.rotation.x = -0.3;
bouquet.add(tag2);

/* ============ 360° NEON CYCLORAMA BACKGROUND ============ */
/* A flat backdrop only covers the angle it faces — orbit the camera past it and
   you hit black void. Instead we wrap a big cylinder all the way around the
   scene (seen from its inside, BackSide) and scatter the neon signs at many
   angles across two radii, so wherever the camera looks there is background. */
const bgGroup = new THREE.Group();
scene.add(bgGroup);

function makeNeonTextTexture(text, color='#ff3366', w=512,h=256){
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  const ctx = c.getContext('2d');
  ctx.clearRect(0,0,w,h);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font = '700 46px Georgia';
  ctx.shadowColor = color; ctx.shadowBlur = 30;
  ctx.fillStyle = color;
  const lines = text.split('\n');
  lines.forEach((line,i)=> ctx.fillText(line, w/2, h/2 + (i-(lines.length-1)/2)*54));
  ctx.shadowBlur = 12;
  ctx.fillStyle = '#fff';
  lines.forEach((line,i)=> ctx.fillText(line, w/2, h/2 + (i-(lines.length-1)/2)*54));
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
function makeNeonHeartTexture(color='#ff1744', w=256,h=256){
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  const ctx = c.getContext('2d');
  ctx.clearRect(0,0,w,h);
  ctx.translate(w/2,h/2*0.85);
  ctx.beginPath();
  const s = 70;
  ctx.moveTo(0, s*0.3);
  ctx.bezierCurveTo(0,-s*0.3, -s,-s*0.5, -s, s*0.05);
  ctx.bezierCurveTo(-s, s*0.55, -s*0.3, s*0.8, 0, s*1.15);
  ctx.bezierCurveTo(s*0.3, s*0.8, s, s*0.55, s, s*0.05);
  ctx.bezierCurveTo(s, -s*0.5, 0, -s*0.3, 0, s*0.3);
  ctx.closePath();
  ctx.shadowColor = color; ctx.shadowBlur = 35;
  ctx.strokeStyle = color; ctx.lineWidth = 6; ctx.stroke();
  ctx.shadowBlur = 15;
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  return new THREE.CanvasTexture(c);
}

const spriteMat = (tex) => new THREE.SpriteMaterial({ map: tex, transparent:true, depthWrite:false });

// cyclorama sky-dome: a fully CLOSED sphere wrapping the entire scene, seen from
// inside (BackSide). Unlike a cylinder, a sphere has no open rim/top edge that can
// peek into black void — wherever the camera looks, it's sphere interior, period.
const cycloRadius = 46;
const cycloCanvas = document.createElement('canvas');
cycloCanvas.width = 8; cycloCanvas.height = 256;
const cctx = cycloCanvas.getContext('2d');
const cgrad = cctx.createLinearGradient(0,0,0,256);
cgrad.addColorStop(0, '#4a1826');   // v=0 → sphere top (sky) — lightest
cgrad.addColorStop(0.45, '#2a0d16');
cgrad.addColorStop(1, '#150609');   // v=1 → sphere bottom (ground) — darkest
cctx.fillStyle = cgrad; cctx.fillRect(0,0,8,256);
const cycloTex = new THREE.CanvasTexture(cycloCanvas);
const cycloGeo = new THREE.SphereGeometry(cycloRadius, 48, 32);
const cyclo = new THREE.Mesh(cycloGeo, new THREE.MeshBasicMaterial({ map: cycloTex, side: THREE.BackSide, fog:true }));
cyclo.position.y = 2.6; // roughly the camera's orbit-target height, so the gradient centers on eye level
bgGroup.add(cyclo);

// neon signs scattered every ~30-40° around the full circle, alternating between two radii for depth
const neonKinds = [
  () => makeNeonTextTexture('Las mejores\ncosas florécen','#ff2d7a'),
  () => makeNeonTextTexture('Amor\nSiempre','#ff3366'),
  () => makeNeonHeartTexture('#ff1744'),
  () => makeNeonHeartTexture('#ff2d7a'),
  () => makeNeonHeartTexture('#ff0033'),
];
const neonSprites = [];
const NEON_COUNT = 12;
for(let i=0;i<NEON_COUNT;i++){
  const angle = (i/NEON_COUNT)*Math.PI*2 + (i%2===0 ? 0 : 0.16);
  const nearLayer = i % 2 === 0;
  const radius = nearLayer ? 15 : 20.5;
  const tex = neonKinds[i % neonKinds.length]();
  const isText = i % neonKinds.length < 2;
  const scale = isText ? (nearLayer ? [4.6,2.3] : [6.2,3.1]) : (nearLayer ? [1.6,1.6] : [2.6,2.6]);
  const sprite = new THREE.Sprite(spriteMat(tex));
  const y = 2 + Math.sin(i*1.7)*2.2 + (nearLayer?0:1.2);
  sprite.position.set(Math.cos(angle)*radius, y, Math.sin(angle)*radius);
  sprite.scale.set(scale[0], scale[1], 1);
  sprite.userData.baseScale = { x: scale[0], y: scale[1] };
  sprite.userData.phase = i;
  bgGroup.add(sprite);
  neonSprites.push(sprite);
}

/* Reflections of the neon signs on the floor now come from the real Water
   object above (it renders an actual mirror pass of the scene), so no manual
   mirrored-sprite trick is needed here anymore. */

/* ============ ENVIRONMENT MAP (for reflections/clearcoat) ============ */
const pmrem = new THREE.PMREMGenerator(renderer);
const envScene = new THREE.Scene();
envScene.background = new THREE.Color(0x1a0508);
const envLight1 = new THREE.Mesh(new THREE.SphereGeometry(5,16,16), new THREE.MeshBasicMaterial({color:0xff2d5a}));
envLight1.position.set(10,10,-10); envScene.add(envLight1);
const envTex = pmrem.fromScene(envScene, 0.1).texture;
scene.environment = envTex;
envScene.clear && envScene.clear();

/* ============ RESIZE ============ */
function onResize(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', onResize);

/* ============ AUDIO — música en loop + análisis para luces reactivas ============ */
const bgMusic = document.getElementById('bgMusic');
const btnMusic = document.getElementById('btnMusic');
let audioCtx = null, analyser = null, freqData = null, musicPlaying = false;

function initAudioGraph(){
  if(audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const source = audioCtx.createMediaElementSource(bgMusic);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 128;
  analyser.smoothingTimeConstant = 0.82;
  freqData = new Uint8Array(analyser.frequencyBinCount);
  source.connect(analyser);
  analyser.connect(audioCtx.destination);
}

function markPlaying(){
  musicPlaying = true;
  btnMusic.textContent = '🔇 Silenciar';
  btnMusic.classList.add('active');
}
function markStopped(){
  musicPlaying = false;
  btnMusic.textContent = '🎵 Reproducir música';
  btnMusic.classList.remove('active');
}

async function tryStartMusic(){
  if(musicPlaying) return true;
  try{
    initAudioGraph();
    if(audioCtx.state === 'suspended') await audioCtx.resume();
    await bgMusic.play(); // el atributo loop en <audio> lo repite indefinidamente hasta cerrar la pestaña
    markPlaying();
    return true;
  } catch(err){
    return false; // bloqueado por la política de autoplay del navegador, o falta song.mp3
  }
}

btnMusic.addEventListener('click', async () => {
  if(musicPlaying){
    bgMusic.pause();
    markStopped();
    return;
  }
  const ok = await tryStartMusic();
  if(!ok) btnMusic.textContent = '⚠ Agrega song.mp3';
});

// Reproducción automática: se intenta apenas carga la página. Si el navegador la
// bloquea (política estándar de autoplay con sonido), arranca sola en cuanto la
// persona haga el primer clic/toque/tecla en cualquier parte de la página —
// sin necesidad de pulsar el botón de música.
tryStartMusic();
const autoplayGate = async () => {
  const ok = await tryStartMusic();
  if(ok){
    ['pointerdown','keydown','touchstart'].forEach(evt => window.removeEventListener(evt, autoplayGate));
  }
};
['pointerdown','keydown','touchstart'].forEach(evt => window.addEventListener(evt, autoplayGate, { passive:true }));

// audio levels read each frame by the render loop (bass/mid/treble, 0..1)
const audioLevel = { bass:0, mid:0, treble:0 };
function updateAudioLevels(){
  if(!analyser || !musicPlaying){ audioLevel.bass=audioLevel.mid=audioLevel.treble=0; return; }
  analyser.getByteFrequencyData(freqData);
  const n = freqData.length;
  const bassEnd = Math.max(1, Math.floor(n*0.18));
  const midEnd = Math.max(bassEnd+1, Math.floor(n*0.55));
  let sum=0; for(let i=0;i<bassEnd;i++) sum += freqData[i];
  audioLevel.bass = sum/bassEnd/255;
  sum=0; for(let i=bassEnd;i<midEnd;i++) sum += freqData[i];
  audioLevel.mid = sum/(midEnd-bassEnd)/255;
  sum=0; for(let i=midEnd;i<n;i++) sum += freqData[i];
  audioLevel.treble = sum/(n-midEnd)/255;
}

/* ============ UI BUTTONS ============ */
const btnSpin = document.getElementById('btnSpin');
btnSpin.addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  btnSpin.textContent = controls.autoRotate ? '⏸ Pausar giro' : '▶ Reanudar giro';
});
document.getElementById('btnReset').addEventListener('click', () => {
  camera.position.set(0,3.6,9.5);
  controls.target.set(0,2.6,0);
  controls.update();
});

/* ============ ANIMATE ============ */
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  const dt = clock.getDelta();

  // gentle bob for the whole bouquet (life-like sway)
  bouquet.position.y = Math.sin(t*0.6)*0.03;
  bouquet.rotation.y += 0.0008;

  controls.update();

  updateAudioLevels();
  const { bass, mid, treble } = audioLevel;

  // animated water surface (real ripple/wave shader) + falling rain + splash rings
  // (the 360° sky-dome needs no manual parallax shift — the neon signs are placed
  // in real 3D around the scene, so orbiting the camera already gives natural
  // perspective parallax against the far background)
  water.material.uniforms['time'].value += dt;
  updateRain(Math.min(dt, 0.05));
  updateSplashes(dt);

  // flicker + audio-reactive pulse on the neon signs (the Water surface reflects them live)
  neonSprites.forEach(o => {
    o.material.opacity = 0.85 + Math.sin(t*6 + o.userData.phase)*0.08 + (Math.random()<0.003 ? -0.3:0) + treble*0.15;
    const base = o.userData.baseScale;
    const pulse = 1 + bass*0.22 + mid*0.08;
    o.scale.set(base.x*pulse, base.y*pulse, 1);
  });

  // light shimmer, boosted by the music's bass/mid/treble bands when playing (idle = just the sine shimmer)
  pinkRim.intensity = (16 + Math.sin(t*1.3)*3) * (1 + bass*1.8);
  magentaRim.intensity = (12 + Math.cos(t*1.7)*3) * (1 + mid*1.6);
  heartLight.intensity = (9 + Math.sin(t*2.1)*2) * (1 + treble*1.5);
  spotLeft.intensity = (60 + Math.sin(t*0.9)*4) * (1 + bass*0.6);
  spotRight.intensity = (50 + Math.cos(t*1.1)*4) * (1 + mid*0.5);
  renderer.toneMappingExposure = 1.15 + treble*0.12 + bass*0.08;

  renderer.render(scene, camera);
}

const loading = document.getElementById('loading');
setTimeout(() => {
  loading.style.opacity = '0';
  setTimeout(()=> loading.style.display='none', 650);
}, 400);

animate();
</script>
